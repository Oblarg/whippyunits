name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allow manual triggering

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  conversion-factor-linter:
    name: Conversion Factor Linter
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt, clippy
        
    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Build whippyunits-core
      run: cargo build --package whippyunits-core
      
    - name: Run conversion factor linter
      run: cargo run --package whippyunits-core --bin conversion_factor_linter
      
  symbol-linter:
    name: Symbol Linter
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt, clippy
        
    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Build whippyunits-core
      run: cargo build --package whippyunits-core
      
    - name: Run symbol linter
      run: cargo run --package whippyunits-core --bin symbol_linter

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt, clippy
        
    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Run tests
      run: cargo test
      
  no-std:
    name: no_std / no_alloc Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The repo pins the toolchain via `rust-toolchain.toml` (stable 1.90.0), which
    # overrides whatever this action installs. So add the bare-metal target to the
    # *pinned* toolchain explicitly below rather than via this action's `targets:`
    # (which would land on the wrong toolchain and leave `core` missing).
    - name: Install Rust
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt, clippy

    # `x86_64-unknown-none` is a bare-metal target with no `std` and no default
    # allocator, so any accidental `std`/`alloc` dependency fails the build. This
    # runs from the repo root so it respects the `rust-toolchain.toml` override and
    # installs the target onto the toolchain the build actually uses.
    - name: Add bare-metal target to pinned toolchain
      run: rustup target add x86_64-unknown-none

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build no_std + no_alloc (default features off)
      run: cargo build -p whippyunits --no-default-features --target x86_64-unknown-none

    - name: Build no_std + alloc
      run: cargo build -p whippyunits --no-default-features --features alloc --target x86_64-unknown-none

    # `--lib` only: the crate's linter binaries are std-only host tools.
    - name: Build whippyunits-core no_std + no_alloc
      run: cargo build -p whippyunits-core --no-default-features --lib --target x86_64-unknown-none

  doc:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt, clippy
        
    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Build documentation
      run: cargo doc --no-deps --workspace
      
  # Optional: Combined job that runs both linters in sequence
  all-linters:
    name: All Linters
    runs-on: ubuntu-latest
    needs: [conversion-factor-linter, symbol-linter]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt, clippy
        
    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Build whippyunits-core
      run: cargo build --package whippyunits-core
      
    - name: Run all linters
      run: |
        echo "🔍 Running Conversion Factor Linter..."
        cargo run --package whippyunits-core --bin conversion_factor_linter
        echo ""
        echo "🔍 Running Symbol Linter..."
        cargo run --package whippyunits-core --bin symbol_linter
        echo ""
        echo "✅ All linters completed successfully!"
